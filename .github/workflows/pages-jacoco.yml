name: Publish JaCoCo coverage to GitHub Pages (reusable)

on:
  workflow_call:
    inputs:
      java-version:
        description: 'JDK version to build with'
        required: false
        type: string
        default: '21'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and test (generates every module's coverage report)
        run: ./gradlew build --console=plain

      # Collects every module's JaCoCo HTML report into one static site, grouped by top-level
      # category folder, plus a real (not placeholder) landing page linking to each - no
      # per-repo scripting needed to reuse this, and no build step or framework: one CSS file,
      # inlined title-casing done in bash, done.
      - name: Assemble the coverage site
        shell: bash
        run: |
          set -e
          mkdir -p _site

          cat > _site/style.css <<'CSS'
:root {
  --bg: #ffffff;
  --fg: #1a1a2e;
  --muted: #6b7280;
  --accent: #2563eb;
  --card-bg: #f8fafc;
  --card-border: #e2e8f0;
  --card-hover: #eef2ff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1117;
    --fg: #e5e7eb;
    --muted: #9ca3af;
    --accent: #60a5fa;
    --card-bg: #1a1d27;
    --card-border: #2d313d;
    --card-hover: #232838;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.5;
}
header, main, footer { max-width: 960px; margin: 0 auto; }
header { padding: 3rem 1.5rem 2rem; }
header h1 { font-size: 1.75rem; margin: 0 0 0.5rem; }
header p { color: var(--muted); margin: 0; }
header a, footer a { color: var(--accent); text-decoration: none; }
header a:hover, footer a:hover { text-decoration: underline; }
main { padding: 0 1.5rem 3rem; }
section { margin-bottom: 2.5rem; }
section h2 {
  font-size: 1.1rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  margin: 0 0 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--card-border);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 0.75rem;
}
.card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.9rem 1.1rem;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 8px;
  color: var(--fg);
  text-decoration: none;
  font-weight: 500;
  transition: background 0.15s ease, transform 0.15s ease;
}
.card:hover { background: var(--card-hover); transform: translateY(-1px); }
.card .arrow { color: var(--muted); }
footer { padding: 1.5rem; color: var(--muted); font-size: 0.85rem; text-align: center; }
CSS

          repo_url="https://github.com/${GITHUB_REPOSITORY}"
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo "<title>Coverage Reports — ${GITHUB_REPOSITORY#*/}</title>"
            echo '<link rel="stylesheet" href="style.css"></head><body>'
            echo "<header><h1>${GITHUB_REPOSITORY#*/}</h1>"
            echo "<p>Test coverage reports, generated on every push to master. <a href=\"${repo_url}\">View source on GitHub →</a></p></header>"
            echo '<main>'
          } > _site/index.html

          # One section per top-level category directory that actually has a built module in
          # it, in a fixed, deliberate order rather than whatever order the filesystem returns.
          for category in linear trees hashing graphs; do
            [ -d "$category" ] || continue
            modules=$(find "$category" -maxdepth 1 -mindepth 1 -type d | sort)
            [ -z "$modules" ] && continue

            category_title=$(echo "$category" | sed 's/\b\(.\)/\u\1/g')
            echo "<section><h2>${category_title}</h2><div class=\"grid\">" >> _site/index.html

            for moddir in $modules; do
              modname=$(basename "$moddir")
              report="$moddir/build/reports/jacoco/test/html"
              [ -d "$report" ] || continue
              dest="_site/$category/$modname"
              mkdir -p "$dest"
              cp -r "$report"/. "$dest"/
              display_name=$(echo "$modname" | sed -e 's/-/ /g' -e 's/\b\(.\)/\u\1/g')
              echo "<a class=\"card\" href=\"${category}/${modname}/index.html\"><span>${display_name}</span><span class=\"arrow\">→</span></a>" >> _site/index.html
            done

            echo '</div></section>' >> _site/index.html
          done

          {
            echo '</main>'
            echo "<footer><p>Generated automatically by <a href=\"${repo_url}/actions\">GitHub Actions</a> — never hand-edited.</p></footer>"
            echo '</body></html>'
          } >> _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
