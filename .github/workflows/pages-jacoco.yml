name: Publish JaCoCo coverage to GitHub Pages (reusable)

on:
  workflow_call:
    inputs:
      java-version:
        description: 'JDK version to build with'
        required: false
        type: string
        default: '21'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and test (generates every module's coverage report)
        run: ./gradlew build --console=plain

      - name: Check out ci-templates (for the site generator script)
        uses: actions/checkout@v4
        with:
          repository: leon-lourenco/ci-templates
          ref: master
          path: .ci-templates

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the site generator's one dependency
        run: npm install marked --no-save --prefix .ci-templates/scripts

      # Renders each module's own README (problem/solution+mermaid/classic+applied examples/
      # benchmark) into a real page, embeds that module's test source, links its JaCoCo report,
      # and builds a gallery index with an icon per structure - see ci-templates' script for
      # the actual template. Nothing here is repo-specific beyond the linear/trees/hashing/
      # graphs category names, so any repo following the same classic/applied README
      # convention can reuse this workflow unmodified.
      - name: Generate the docs site
        run: node .ci-templates/scripts/generate-docs-site.js _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
