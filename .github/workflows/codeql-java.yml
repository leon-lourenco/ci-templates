name: CodeQL analysis (Java, reusable)

on:
  workflow_call:
    inputs:
      java-version:
        description: 'JDK version to build with for analysis'
        required: false
        type: string
        default: '21'
      build-tool:
        description: "'gradle' or 'maven' - picks how the project gets compiled for analysis"
        required: false
        type: string
        default: 'gradle'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: ${{ inputs.build-tool }}

      - name: Set up Gradle
        if: inputs.build-tool == 'gradle'
        uses: gradle/actions/setup-gradle@v6

      # Both build tools get a manual, explicit compile step. CodeQL's own autobuilder doesn't
      # reliably pick up every Gradle project's conventions, and - confirmed the hard way on a
      # repo with two independent pom.xml files and no parent aggregator - it only looks for a
      # single Maven project at the repo root and fails outright on that shape.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Make gradlew executable
        if: inputs.build-tool == 'gradle'
        run: chmod +x gradlew

      - name: Compile every module (Gradle)
        if: inputs.build-tool == 'gradle'
        run: ./gradlew compileJava compileTestJava --console=plain

      # A repo with a root pom.xml is one multi-module reactor - building it once from the root
      # lets Maven resolve inter-module dependencies (e.g. an api module depending on a sibling
      # domain module) via the reactor itself. Building each module's pom.xml independently, as
      # the fallback below does, only works when there's no such coupling - confirmed the hard
      # way on a reactor project where every non-root module failed with "could not find
      # artifact", since its sibling dependencies were never installed to the local repo.
      #
      # A repo with no root pom.xml (several independent Maven projects side by side, each with
      # no parent aggregator) falls back to compiling every pom.xml found, since there's no
      # single reactor root to build from.
      - name: Compile every project (Maven)
        if: inputs.build-tool == 'maven'
        shell: bash
        run: |
          set -e
          if [ -f pom.xml ]; then
            echo "::group::Building . (reactor root)"
            if [ -x "./mvnw" ]; then
              ./mvnw --batch-mode compile test-compile
            else
              mvn --batch-mode compile test-compile
            fi
            echo "::endgroup::"
          else
            find . -maxdepth 3 -name pom.xml -not -path '*/target/*' | while read -r pom; do
              dir=$(dirname "$pom")
              echo "::group::Building $dir"
              if [ -x "$dir/mvnw" ]; then
                (cd "$dir" && ./mvnw --batch-mode compile test-compile)
              else
                (cd "$dir" && mvn --batch-mode compile test-compile)
              fi
              echo "::endgroup::"
            done
          fi

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:java-kotlin'
