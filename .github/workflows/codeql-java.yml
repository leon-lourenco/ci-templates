name: CodeQL analysis (Java, reusable)

on:
  workflow_call:
    inputs:
      java-version:
        description: 'JDK version to build with for analysis'
        required: false
        type: string
        default: '21'
      build-tool:
        description: "'gradle' or 'maven' - picks how the project gets compiled for analysis"
        required: false
        type: string
        default: 'gradle'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: ${{ inputs.build-tool }}

      - name: Set up Gradle
        if: inputs.build-tool == 'gradle'
        uses: gradle/actions/setup-gradle@v4

      # Gradle gets a manual, explicit compile step (see below) since CodeQL's autobuilder
      # doesn't reliably pick up every Gradle project's conventions. Maven's autobuilder handles
      # a plain pom.xml (or several independent ones, as in a multi-service repo) without help.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: ${{ inputs.build-tool == 'gradle' && 'manual' || 'autobuild' }}

      - name: Make gradlew executable
        if: inputs.build-tool == 'gradle'
        run: chmod +x gradlew

      - name: Compile every module (Gradle)
        if: inputs.build-tool == 'gradle'
        run: ./gradlew compileJava compileTestJava --console=plain

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:java-kotlin'
