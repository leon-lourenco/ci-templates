name: CodeQL analysis (Java, reusable)

on:
  workflow_call:
    inputs:
      java-version:
        description: 'JDK version to build with for analysis'
        required: false
        type: string
        default: '21'
      build-tool:
        description: "'gradle' or 'maven' - picks how the project gets compiled for analysis"
        required: false
        type: string
        default: 'gradle'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: ${{ inputs.build-tool }}

      - name: Set up Gradle
        if: inputs.build-tool == 'gradle'
        uses: gradle/actions/setup-gradle@v4

      # Both build tools get a manual, explicit compile step. CodeQL's own autobuilder doesn't
      # reliably pick up every Gradle project's conventions, and - confirmed the hard way on a
      # repo with two independent pom.xml files and no parent aggregator - it only looks for a
      # single Maven project at the repo root and fails outright on that shape.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Make gradlew executable
        if: inputs.build-tool == 'gradle'
        run: chmod +x gradlew

      - name: Compile every module (Gradle)
        if: inputs.build-tool == 'gradle'
        run: ./gradlew compileJava compileTestJava --console=plain

      # Finds every pom.xml in the repo (root aggregator or several independent projects alike)
      # and compiles each with its own wrapper if it has one, falling back to a system `mvn`.
      - name: Compile every project (Maven)
        if: inputs.build-tool == 'maven'
        shell: bash
        run: |
          set -e
          find . -maxdepth 3 -name pom.xml -not -path '*/target/*' | while read -r pom; do
            dir=$(dirname "$pom")
            echo "::group::Building $dir"
            if [ -x "$dir/mvnw" ]; then
              (cd "$dir" && ./mvnw --batch-mode compile test-compile)
            else
              (cd "$dir" && mvn --batch-mode compile test-compile)
            fi
            echo "::endgroup::"
          done

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:java-kotlin'
